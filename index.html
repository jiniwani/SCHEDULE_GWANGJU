<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>검사실 근무표 스케줄러</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --line:#d8dee9;
    --text:#1f2937;
    --muted:#6b7280;
    --primary:#2563eb;
    --primary-soft:#eaf2ff;
    --danger:#dc2626;
    --sun:#e11d48;
    --sat:#2563eb;
    --holiday-border:#fecdd3;
    --subholiday-border:#fed7aa;
    --chip-day-bg:#e0f2fe;
    --chip-day-text:#075985;
    --chip-night-bg:#ede9fe;
    --chip-night-text:#5b21b6;
    --chip-off-bg:#f3f4f6;
    --chip-off-text:#374151;
    --shadow:0 8px 24px rgba(15,23,42,.08);
    --work-bg-start:#dbeafe;
    --work-bg-end:#eef5ff;
    --work-border:#60a5fa;
    --work-outline:#93c5fd;
    --work-text:#1d4ed8;
    --off-bg-start:#e5e7eb;
    --off-bg-end:#f3f4f6;
    --off-border:#94a3b8;
    --off-outline:#cbd5e1;
    --off-text:#475569;
    --work-bg-start-fade:#eef4fb;
    --work-bg-end-fade:#f6f9fd;
    --work-border-fade:#bfd5f5;
    --work-outline-fade:#d8e6fb;
    --work-text-fade:#7aa2de;
    --off-bg-start-fade:#f1f3f5;
    --off-bg-end-fade:#f7f8fa;
    --off-border-fade:#d2d8e1;
    --off-outline-fade:#e2e8f0;
    --off-text-fade:#8b95a7;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,"Malgun Gothic",sans-serif;
  }

  .app{
    width:100%;
    max-width:none;
    margin:0 auto;
    padding:16px;
  }

  .layout{
    display:block;
    position:relative;
  }

  .main-area{
    min-width:0;
    width:100%;
  }

  .memo-panel{
    width:360px;
    max-width:calc(100vw - 24px);
    position:fixed;
    top:16px;
    right:16px;
    bottom:16px;
    z-index:1200;
    overflow:auto;
    transition:transform .22s ease, opacity .22s ease;
    transform:translateX(0);
    opacity:1;
  }

  .memo-panel.hidden{
    display:block !important;
    transform:translateX(calc(100% + 24px));
    opacity:0;
    pointer-events:none;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }

  .title-area{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }

  .title{
    font-size:22px;
    font-weight:800;
  }

  .month-nav{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:8px 10px;
    box-shadow:var(--shadow);
  }

  .month-label{
    min-width:120px;
    text-align:center;
    font-size:18px;
    font-weight:800;
  }

  .toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:nowrap;
    white-space:nowrap;
    overflow-x:auto;
  }

  .toolbar > *{
    flex-shrink:0;
  }

  .toolbar .filter-box:first-child{
    flex:0 1 auto;
    min-width:0;
  }

  .filter-controls > *{
    flex-shrink:0;
  }


  button,input,select,textarea{
    font:inherit;
  }

  .btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--text);
    border-radius:10px;
    padding:8px 12px;
    cursor:pointer;
  }

  .btn:hover{background:#f8fafc}
  .btn.primary{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
  .btn.danger{
    background:#fff5f5;
    border-color:#fecaca;
    color:#b91c1c;
  }
  .btn.small{
    padding:5px 8px;
    font-size:12px;
  }

  .tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }

  .tab{
    border:1px solid var(--line);
    background:#fff;
    color:var(--muted);
    border-radius:999px;
    padding:9px 14px;
    cursor:pointer;
    font-weight:700;
  }

  .tab.active{
    background:var(--primary-soft);
    color:var(--primary);
    border-color:#bfd4ff;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:14px;
    box-shadow:var(--shadow);
  }

  .hidden{display:none !important}
  .admin-only.hidden-by-role{display:none !important}
  .viewer-only.hidden-by-role{display:none !important}
  .role-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    font-size:13px;
    font-weight:800;
    color:var(--muted);
  }

  .sync-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    border:1px solid var(--line);
    background:#fff;
    color:var(--muted);
    transition:all .3s;
  }
  .sync-badge.saving{ color:#d97706; border-color:#fcd34d; background:#fffbeb; }
  .sync-badge.saved{  color:#16a34a; border-color:#86efac; background:#f0fdf4; }
  .sync-badge.error{  color:#dc2626; border-color:#fca5a5; background:#fff1f2; }
  .sync-badge.loading{ color:#2563eb; border-color:#93c5fd; background:#eff6ff; }

  /* 저장 버튼 미저장 상태 */
  #explicitSaveBtn.unsaved{
    background:#f59e0b;
    border-color:#f59e0b;
    color:#fff;
    animation: pulse-save 1.8s ease-in-out infinite;
  }
  @keyframes pulse-save{
    0%,100%{ opacity:1; }
    50%{ opacity:.7; }
  }

  /* 옵션 드롭다운 */
  .options-wrap{
    position:relative;
  }
  .options-menu{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    min-width:180px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 8px 28px rgba(15,23,42,.13);
    padding:6px;
    z-index:900;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .options-item{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-radius:9px;
    padding:9px 12px;
    font-size:13px;
    font-weight:700;
    color:var(--text);
    cursor:pointer;
    white-space:nowrap;
  }
  .options-item:hover{ background:#f1f5f9; }
  .options-divider{
    height:1px;
    background:var(--line);
    margin:4px 0;
  }
  .role-badge.admin{
    color:var(--primary);
    border-color:#bfd4ff;
    background:var(--primary-soft);
  }

  .legend{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }

  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--muted);
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 10px;
  }

  .dot{width:12px;height:12px;border-radius:4px}
  .calendar-wrap{overflow:auto}
  .print-title{display:none}

  table.calendar{
    width:100%;
    min-width:1500px;
    table-layout:fixed;
    border-collapse:separate;
    border-spacing:8px;
  }

  .calendar th{
    background:#eef2f7;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 4px;
    font-size:14px;
    text-align:center;
  }

  .calendar th.sun{color:var(--sun)}
  .calendar th.sat{color:var(--sat)}

  .day-cell{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    vertical-align:top;
    height:228px;
    padding:10px;
    box-shadow:var(--shadow);
    position:relative;
  }

  .day-cell.other-month{
    opacity:1 !important;
    background:#f1f5f9 !important;
  }

  .day-cell.other-month .day-num{
    color:#9ca3af !important;
  }

  .day-cell.holiday{
    background:linear-gradient(180deg,#fff7f8 0%,#ffffff 42%);
    border-color:var(--holiday-border);
  }

  .day-cell.subholiday{
    background:linear-gradient(180deg,#fffaf3 0%,#ffffff 42%);
    border-color:var(--subholiday-border);
  }

  .day-cell.warn{
    outline:2px solid rgba(220,38,38,.55);
  }

  .day-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    margin-bottom:8px;
    min-height:34px;
  }

  .day-num{
    font-size:20px;
    font-weight:800;
    line-height:1;
  }

  .day-num.sun{color:var(--sun)}
  .day-num.sat{color:var(--sat)}
  .day-cell.holiday .day-num,
  .day-cell.subholiday .day-num{
    color:var(--sun) !important;
  }

  .badge-wrap{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .holiday-badge,
  .subholiday-badge{
    font-size:11px;
    font-weight:700;
    border-radius:999px;
    padding:5px 8px;
    white-space:nowrap;
  }

  .holiday-badge{
    background:#ffe4e6;
    color:#be123c;
    border:1px solid #fecdd3;
  }

  .subholiday-badge{
    background:#ffedd5;
    color:#c2410c;
    border:1px solid #fdba74;
  }

  .mini-actions{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
    margin-top:6px;
  }

  .mini-btn{
    border:1px solid #dbe3ef;
    background:#fff;
    color:#475569;
    border-radius:8px;
    font-size:11px;
    padding:3px 6px;
    cursor:pointer;
  }

  .mini-btn:hover{background:#f8fafc}
  .mini-btn.copy-active{
    background:#dbeafe;
    border-color:#93c5fd;
    color:#1d4ed8;
    font-weight:700;
  }

  .shift-block{
    display:grid;
    grid-template-columns:42px 1fr;
    gap:6px;
    margin-bottom:8px;
    align-items:start;
    border-radius:10px;
    padding:3px 4px;
    transition:.15s ease;
  }

  .shift-block.drag-over{
    background:#eef6ff;
    outline:1px dashed #93c5fd;
  }

  .shift-label{
    font-size:12px;
    font-weight:800;
    color:var(--muted);
    padding-top:4px;
  }

  .slot-area{
    min-height:30px;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    align-items:flex-start;
    overflow:visible;
  }

  .person-chip,
  .off-chip,
  .empty-slot{
    display:inline-flex;
    align-items:center;
    gap:4px;
    border-radius:999px;
    padding:5px 8px;
    font-size:12px;
    line-height:1.2;
    border:1px solid transparent;
    white-space:nowrap;
  }

  .person-chip{
    background:var(--chip-day-bg);
    color:var(--chip-day-text);
    border-color:#bae6fd;
    cursor:grab;
  }

  .night-chip{
    background:var(--chip-night-bg);
    color:var(--chip-night-text);
    border-color:#ddd6fe;
  }

  .off-chip{
    background:var(--chip-off-bg);
    color:var(--chip-off-text);
    border-color:#e5e7eb;
    cursor:grab;
  }

  .person-chip:hover,
  .off-chip:hover{transform:translateY(-1px)}

  .empty-slot{
    background:#f8fafc;
    color:#94a3b8;
    border-color:#e2e8f0;
    cursor:pointer;
  }

  .count-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:8px;
  }

  .count-pill{
    font-size:11px;
    font-weight:800;
    border-radius:999px;
    padding:5px 8px;
    background:#f8fafc;
    border:1px solid var(--line);
    color:var(--muted);
  }

  .count-pill.bad{
    color:#b91c1c;
    background:#fff1f2;
    border-color:#fecdd3;
  }

  .grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .form-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:end;
    margin-bottom:10px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:160px;
  }

  .field label{
    font-size:13px;
    font-weight:800;
    color:var(--muted);
  }

  .field input,
  .field select,
  .memo-textarea{
    border:1px solid var(--line);
    background:#fff;
    border-radius:10px;
    padding:10px 12px;
  }

  .memo-textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
  }

  table.basic{
    width:100%;
    border-collapse:collapse;
  }

  table.basic th,
  table.basic td{
    border-bottom:1px solid #e8edf4;
    padding:10px 8px;
    text-align:left;
    font-size:14px;
  }

  table.basic th{
    color:var(--muted);
    background:#fafcff;
  }

  .tag-box{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .tag-label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 10px;
    background:#fff;
    font-size:13px;
  }

  .muted{color:var(--muted)}

  .modal-bg{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.42);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:16px;
  }

  .modal-bg.open{display:flex}

  .modal{
    width:min(760px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:20px;
    border:1px solid var(--line);
    box-shadow:0 28px 70px rgba(15,23,42,.24);
    padding:18px;
  }

  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    gap:8px;
  }

  .modal-title{
    font-size:20px;
    font-weight:800;
  }

  .modal-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-top:14px;
    flex-wrap:wrap;
  }

  .memo-title{
    font-size:18px;
    font-weight:800;
    margin:0 0 10px 0;
  }

  .memo-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:14px;
  }

  .memo-item{
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    background:#fff;
  }

  .memo-item-head{
    display:flex;
    justify-content:space-between;
    gap:8px;
    align-items:flex-start;
    margin-bottom:8px;
  }

  .memo-item-title{
    font-weight:800;
    font-size:14px;
    line-height:1.3;
    word-break:break-word;
  }

  .memo-item-body{
    font-size:13px;
    color:#475569;
    white-space:pre-wrap;
    word-break:break-word;
    margin-bottom:10px;
  }

  .memo-item-date{
    font-size:11px;
    color:#94a3b8;
  }

  .memo-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }

  .app-footer{
    margin-top:16px;
    text-align:center;
    font-size:13px;
    color:var(--muted);
    padding:12px 0 4px;
  }

  .filter-box{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    min-width:0;
  }

  .filter-box label{
    font-size:13px;
    font-weight:800;
    color:var(--muted);
    white-space:nowrap;
  }

  .filter-box select{
    width:140px;
    min-width:140px;
    max-width:140px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:10px;
    padding:7px 10px;
  }

  .filter-status{
    display:inline-block;
    width:96px;
    min-width:96px;
    max-width:96px;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:12px;
    color:var(--muted);
    margin-left:2px;
    white-space:nowrap;
    vertical-align:middle;
  }

  .filter-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:nowrap;
    white-space:nowrap;
    min-width:0;
  }

  @media (max-width: 768px){
    .toolbar{
      flex-wrap:wrap;
    }
    .filter-box.viewer-only{
      width:100%;
      flex-wrap:wrap;
    }
    .filter-controls{
      flex-wrap:wrap;
      white-space:normal;
      width:100%;
    }
    .filter-controls .filter-box{
      width:100%;
      flex-wrap:wrap;
    }
    .filter-box select{
      width:100%;
      min-width:0;
      max-width:none;
      flex:1;
    }
    .filter-status{
      width:auto;
      min-width:0;
      max-width:none;
    }
    .color-picker-group,
    .preset-group{
      flex-wrap:nowrap;
    }
  }

  .color-picker-group{
    display:flex;
    align-items:center;
    gap:4px;
    flex-wrap:nowrap;
    white-space:nowrap;
  }

  .color-picker-group label{
    font-size:12px;
    color:var(--muted);
    font-weight:700;
    white-space:nowrap;
  }

  .color-picker{
    width:34px;
    height:34px;
    padding:2px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    cursor:pointer;
  }

  .preset-group{
    display:flex;
    align-items:center;
    gap:5px;
    flex-wrap:nowrap;
    white-space:nowrap;
  }

  .preset-label{
    font-size:12px;
    color:var(--muted);
    font-weight:700;
  }

  .preset-btn{
    width:24px;
    height:24px;
    border:1px solid var(--line);
    border-radius:999px;
    padding:0;
    font-size:0;
    cursor:pointer;
    position:relative;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);
  }

  .preset-btn:hover{
    transform:translateY(-1px);
  }

  .preset-btn.preset-classic{
    background:linear-gradient(135deg,#dbeafe 0 50%, #fee2e2 50% 100%);
  }

  .preset-btn.preset-mint{
    background:linear-gradient(135deg,#d1fae5 0 50%, #ecfeff 50% 100%);
  }

  .preset-btn.preset-warm{
    background:linear-gradient(135deg,#fef3c7 0 50%, #ffe4e6 50% 100%);
  }

  .preset-btn.preset-violet{
    background:linear-gradient(135deg,#ede9fe 0 50%, #f5f3ff 50% 100%);
  }

  .day-cell.filter-dim{
    opacity:.55;
  }

  .day-cell.emp-work-highlight{
    background:linear-gradient(180deg,var(--work-bg-start) 0%, var(--work-bg-end) 44%);
    border-color:var(--work-border);
    box-shadow:0 0 0 2px var(--work-outline), var(--shadow);
  }

  .day-cell.emp-off-highlight{
    background:linear-gradient(180deg,var(--off-bg-start) 0%, var(--off-bg-end) 44%);
    border-color:var(--off-border);
    box-shadow:0 0 0 2px var(--off-outline), var(--shadow);
  }

  .day-cell.emp-work-highlight .day-num,
  .day-cell.emp-off-highlight .day-num{
    color:#111827 !important;
  }
  .day-cell.emp-work-highlight .day-num.sun,
  .day-cell.emp-off-highlight .day-num.sun{
    color:var(--sun) !important;
  }
  .day-cell.emp-work-highlight .day-num.sat,
  .day-cell.emp-off-highlight .day-num.sat{
    color:var(--sat) !important;
  }
  .day-cell.emp-work-highlight.holiday .day-num,
  .day-cell.emp-work-highlight.subholiday .day-num,
  .day-cell.emp-off-highlight.holiday .day-num,
  .day-cell.emp-off-highlight.subholiday .day-num{
    color:var(--sun) !important;
  }

  .day-cell.emp-work-highlight.warn,
  .day-cell.emp-off-highlight.warn{
    outline:none !important;
  }


  .person-chip.employee-focus,
  .off-chip.employee-focus{
    font-weight:800;
    box-shadow:0 0 0 2px rgba(15,23,42,.12);
  }

  .person-chip.employee-focus{
    background:#dbeafe !important;
    border-color:#60a5fa !important;
    color:#1d4ed8 !important;
  }

  .off-chip.employee-focus{
    background:#e2e8f0 !important;

<script>
  const STORAGE_KEY = 'labSchedulerSimpleDefaultV1';

  const TAGS = [
    '연차',

  // 현재 세션에서 사용할 비밀번호 해시 (로그인 시 입력값과 비교)
  // 실제 해시는 api.js의 KV에서 관리됨 — 앱 UI에서 변경 가능
  const DEFAULT_ADMIN_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
  let ADMIN_PASSWORD_HASH = DEFAULT_ADMIN_HASH;
  const ADMIN_SESSION_KEY = 'labSchedulerAdminSessionV1';

  let dragData = null;
  let editingMemoId = null;

  let state = {
    year: 2026,
    month: 3,
    slotConfig: { 조출: 0, 주간: 3, 야간: 6 },
    visibleRows: { 조출: false, 야간: true },
    copiedDateKey: null,
    memoOpen: false,
    memos: [],
    employees: [
      { id: 1, name: '박준환', role: '주간' },
      { id: 2, name: '손가영', role: '주간' },
      { id: 3, name: '정석희', role: '주간' },
      { id: 4, name: '김지효', role: '야간' },
      { id: 5, name: '한혜림', role: '야간' },
      { id: 6, name: '박석호', role: '야간' },
      { id: 7, name: '강승혜', role: '야간' },
      { id: 8, name: '조영오', role: '야간' },
      { id: 9, name: '양다연', role: '야간' }
    ],
    schedule: {},
    holidays: {
      '2026-03-01': { name: '삼일절' }
    },
    subHolidays: {
      '2026-03-02': { name: '대체공휴일' }
    },
    activeTab: 'calendar',
    selectedEmployeeId: null,
    isAdmin: false,
    highlightColors: {
      work: '#dbeafe',
      off: '#fee2e2'
    }
  };

  const COLOR_PRESETS = {
    classic: { work: '#dbeafe', off: '#fee2e2' },
    mint: { work: '#d1fae5', off: '#ecfeff' },
    warm: { work: '#fef3c7', off: '#ffe4e6' },
    violet: { work: '#ede9fe', off: '#f5f3ff' }
  };

  function clamp(v, min, max){
    return Math.max(min, Math.min(max, v));
  }

  function hexToRgb(hex){
    const cleaned = String(hex || '').replace('#','').trim();
    const full = cleaned.length === 3 ? cleaned.split('').map(c => c + c).join('') : cleaned;
    const num = parseInt(full, 16);
    if(Number.isNaN(num) || full.length !== 6) return { r: 219, g: 234, b: 254 };
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }

  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v => clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
  }

  function mixWithWhite(hex, ratio){
    const {r,g,b}=hexToRgb(hex);
    return rgbToHex(r + (255-r)*ratio, g + (255-g)*ratio, b + (255-b)*ratio);
  }

  function darken(hex, ratio){
    const {r,g,b}=hexToRgb(hex);
    return rgbToHex(r*(1-ratio), g*(1-ratio), b*(1-ratio));
  }

  function ensureHighlightColors(){
    if(!state.highlightColors) state.highlightColors = { work:'#60a5fa', off:'#94a3b8' };
    if(!state.highlightColors.work) state.highlightColors.work = '#60a5fa';
    if(!state.highlightColors.off) state.highlightColors.off = '#94a3b8';
  }

  function ensureEarlyShiftSetting(){
    if(!state.slotConfig) state.slotConfig = {};
    if(typeof state.slotConfig.조출 !== 'number') state.slotConfig.조출 = 0;
  }

  function ensureVisibleRows(){
    if(!state.visibleRows) state.visibleRows = { 조출: false, 야간: true };
    if(typeof state.visibleRows.조출 !== 'boolean') state.visibleRows.조출 = (state.slotConfig?.조출 || 0) > 0;
    if(typeof state.visibleRows.야간 !== 'boolean') state.visibleRows.야간 = true;
  }

  function applyHighlightColors(){
    ensureHighlightColors();
    const root = document.documentElement;
    const work = state.highlightColors.work;
    const off = state.highlightColors.off;

    root.style.setProperty('--work-bg-start', mixWithWhite(work, 0.65));
    root.style.setProperty('--work-bg-end', mixWithWhite(work, 0.84));
    root.style.setProperty('--work-border', work);
    root.style.setProperty('--work-outline', mixWithWhite(work, 0.45));
    root.style.setProperty('--work-text', darken(work, 0.22));
    root.style.setProperty('--off-bg-start', mixWithWhite(off, 0.68));
    root.style.setProperty('--off-bg-end', mixWithWhite(off, 0.84));
    root.style.setProperty('--off-border', off);
    root.style.setProperty('--off-outline', mixWithWhite(off, 0.46));
    root.style.setProperty('--off-text', darken(off, 0.22));

    root.style.setProperty('--work-bg-start-fade', mixWithWhite(work, 0.88));
    root.style.setProperty('--work-bg-end-fade', mixWithWhite(work, 0.94));
    root.style.setProperty('--work-border-fade', mixWithWhite(work, 0.72));
    root.style.setProperty('--work-outline-fade', mixWithWhite(work, 0.82));
    root.style.setProperty('--work-text-fade', mixWithWhite(darken(work,0.12), 0.35));
    root.style.setProperty('--off-bg-start-fade', mixWithWhite(off, 0.9));
    root.style.setProperty('--off-bg-end-fade', mixWithWhite(off, 0.95));
    root.style.setProperty('--off-border-fade', mixWithWhite(off, 0.74));
    root.style.setProperty('--off-outline-fade', mixWithWhite(off, 0.84));
    root.style.setProperty('--off-text-fade', mixWithWhite(darken(off,0.1), 0.38));

    const workPicker = document.getElementById('workColorPicker');
    const offPicker = document.getElementById('offColorPicker');
    if(workPicker) workPicker.value = work;
    if(offPicker) offPicker.value = off;
  }

  function setHighlightColor(type, value){
    ensureHighlightColors();
    if(type === 'work' || type === 'off'){
      state.highlightColors[type] = value;
      saveState();
      applyHighlightColors();
      renderAll();
    }
  }

  function applyColorPreset(name){
    const preset = COLOR_PRESETS[name];
    if(!preset) return;
    state.highlightColors = { ...preset };
    saveState();
    applyHighlightColors();
    renderAll();
  }

  function isAdmin(){
    return !!state.isAdmin;
  }

  function requireAdmin(){
    if(isAdmin()) return true;
    alert('관리자 로그인 후 사용할 수 있어.');
    return false;
  }

  function saveAdminSession(){
    sessionStorage.setItem(ADMIN_SESSION_KEY, state.isAdmin ? '1' : '0');
  }

  function loadAdminSession(){
    state.isAdmin = sessionStorage.getItem(ADMIN_SESSION_KEY) === '1';
  }

  let syncTimer = null;
  function showSyncStatus(status){
    const badge = document.getElementById('syncBadge');
    if(!badge) return;
    clearTimeout(syncTimer);
    const map = {
      saving:  { text:'저장 중…',  cls:'saving'  },
      saved:   { text:'저장 완료', cls:'saved'   },
      error:   { text:'저장 실패', cls:'error'   },
      loading: { text:'불러오는 중…', cls:'loading' },
      loaded:  { text:'',          cls:''        },
    };
    const m = map[status] || {};
    if(!m.text){ badge.style.display='none'; return; }
    badge.textContent = m.text;
    badge.className = 'sync-badge ' + m.cls;
    badge.style.display = 'inline-flex';
    if(status === 'saved'){
      syncTimer = setTimeout(()=>{ badge.style.display='none'; }, 2000);
    }
  }

  // 로컬 상태만 유지 (KV 전송 없음 — 명시적 저장 버튼으로만 KV에 씀)
  function saveState(){
    saveAdminSession();
    // 미저장 변경 있음 표시
    if(isAdmin()) markUnsaved();
  }

  // ── 명시적 저장 (저장 버튼 클릭 시) ──────────────────────────
  async function explicitSave(changeNote){
    if(!isAdmin()) return;
    showSyncStatus('saving');
    try{
      const { isAdmin: _a, ...payload } = state;
      const res = await fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...payload,
          _pwHash: ADMIN_PASSWORD_HASH,
          _changeNote: changeNote || '근무표 수정'
        })
      });
      if(!res.ok) throw new Error('save failed');
      const data = await res.json();
      state._lastTimestamp = data.timestamp || '';
      markSaved();
      showSyncStatus('saved');
    }catch(e){
      showSyncStatus('error');
    }
  }

  // ── 미저장 상태 표시 ──────────────────────────────────────────
  let _hasUnsaved = false;
  function markUnsaved(){
    if(_hasUnsaved) return;
    _hasUnsaved = true;
    const btn = document.getElementById('explicitSaveBtn');
    if(btn){ btn.classList.add('unsaved'); btn.textContent = '● 저장'; }
  }
  function markSaved(){
    _hasUnsaved = false;
    const btn = document.getElementById('explicitSaveBtn');
    if(btn){ btn.classList.remove('unsaved'); btn.textContent = '저장'; }
  }

  async function loadState(){
    showSyncStatus('loading');
    try{
      const res = await fetch('/api/state');
      if(res.ok){
        const parsed = await res.json();
        const { isAdmin: _ignoredIsAdmin, ...safeParsed } = parsed;
        state = { ...state, ...safeParsed };
        showSyncStatus('loaded');
      } else {
        showSyncStatus('error');
      }
    }catch(e){
      showSyncStatus('error');
    }
  }

  function dKey(y,m,d){
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function parseDateKey(key){
    const [y,m,d] = key.split('-').map(Number);
    return new Date(y, m-1, d);
  }

  function getDays(y,m){
    return new Date(y, m, 0).getDate();
  }

  function getMonthKeyPrefix(y,m){
    return `${y}-${String(m).padStart(2,'0')}-`;
  }

  function getMonthMatrix(y,m){
    const first = new Date(y, m-1, 1);
    const firstDay = first.getDay();
    const start = new Date(y, m-1, 1 - firstDay);
    const weeks = [];
    for(let w=0; w<6; w++){
      const week = [];
      for(let d=0; d<7; d++){
        const current = new Date(start);
        current.setDate(start.getDate() + w * 7 + d);
        week.push(current);
      }
      weeks.push(week);
    }
    return weeks;
  }

  function getRenderWeeks(y,m){
    return getMonthMatrix(y,m);
  }

  function isRealMonthInWeek(week, y, m){
    return week.some(date => date.getFullYear() === y && (date.getMonth()+1) === m);
  }

  function isHolidayDate(dateKey){
    return !!state.holidays[dateKey];
  }

  function createDefaultEntry(emp, dateKey){
    const dt = parseDateKey(dateKey);
    const dow = dt.getDay();

    if(dow === 0) return { shift:'휴무', tags:[] };
    if(isHolidayDate(dateKey)) return { shift:'휴무', tags:[] };

    return { shift: emp.role, tags:[] };
  }

  function ensureScheduleForMonth(y,m){
    const days = getDays(y,m);
    for(const emp of state.employees){
      if(!state.schedule[emp.id]) state.schedule[emp.id] = {};
      for(let d=1; d<=days; d++){
        const key = dKey(y,m,d);
        if(state.schedule[emp.id][key]) continue;
        state.schedule[emp.id][key] = createDefaultEntry(emp, key);
      }
    }
  }

  function refreshDefaultEntriesForMonth(y,m){
    const days = getDays(y,m);
    for(const emp of state.employees){
      if(!state.schedule[emp.id]) state.schedule[emp.id] = {};
      for(let d=1; d<=days; d++){
        const key = dKey(y,m,d);
        const current = state.schedule[emp.id][key];
        const fresh = createDefaultEntry(emp, key);

        if(!current){
          state.schedule[emp.id][key] = fresh;
          continue;
        }

        const isUntouched =
          Array.isArray(current.tags) &&
          current.tags.length === 0 &&
          (current.shift === '주간' || current.shift === '야간' || current.shift === '휴무');

        if(isUntouched){
          state.schedule[emp.id][key] = fresh;
        }
      }
    }
  }

  function getEntry(empId, dateKey){
    const dt = parseDateKey(dateKey);
    ensureScheduleForMonth(dt.getFullYear(), dt.getMonth()+1);
    if(!state.schedule[empId]) state.schedule[empId] = {};
    if(!state.schedule[empId][dateKey]){
      const emp = state.employees.find(e=>e.id===empId);
      state.schedule[empId][dateKey] = createDefaultEntry(emp, dateKey);
    }
    return state.schedule[empId][dateKey];
  }

  function getEmployeesByShift(dateKey, shift){
    const arr = [];
    for(const emp of state.employees){
      const entry = getEntry(emp.id, dateKey);
      if(entry.shift === shift){
        arr.push({ employee: emp, entry });
      }
    }
    return arr;
  }

  function validateDay(dateKey){
    ensureVisibleRows();
    const dayCount = getEmployeesByShift(dateKey, '주간').length;
    const nightCount = getEmployeesByShift(dateKey, '야간').length;
    const dayWarn = dayCount !== state.slotConfig.주간;
    const nightWarn = state.visibleRows.야간 ? (nightCount !== state.slotConfig.야간) : false;
    return {
      dayCount,
      nightCount,
      isWarn: dayWarn || nightWarn
    };
  }

  function normalizeTagClass(tag){
    if(/^대휴\(.+\)$/.test(tag)) return 'tag-대휴custom';
    return 'tag-' + tag
      .replaceAll('&','')
      .replaceAll('(','')
      .replaceAll(')','')
      .replaceAll('/','')
      .replaceAll(' ','');
  }

  function renderChip(item, dateKey, shift){
    const classes = item.entry.tags.map(normalizeTagClass).join(' ');
    const text = item.entry.tags.length
      ? `${item.employee.name} (${item.entry.tags.join(', ')})`
      : item.employee.name;

    const base = shift === '야간' ? 'person-chip night-chip' : (shift === '휴무' ? 'off-chip' : 'person-chip');
    const focusClass = Number(state.selectedEmployeeId) === Number(item.employee.id) ? 'employee-focus' : '';
    const clickable = isAdmin()
      ? `draggable="true"
         ondragstart="dragStart(event, ${item.employee.id}, '${dateKey}', '${shift}')"
         onclick="openAssignmentModal(${item.employee.id}, '${dateKey}')"
         title="클릭: 수정 / 드래그: 이동"`
      : `draggable="false" title="${text}"`;

    return `
      <button
        class="${base} ${classes} ${focusClass}"
        ${clickable}
      >
        ${text}
      </button>
    `;
  }

  function renderShiftRow(label, items, slotCount, dateKey){
    const rowClass =
      label === '조출' ? 'shift-row-early' :
      label === '주간' ? 'shift-row-day' :
      label === '야간' ? 'shift-row-night' :
      'shift-row-off';

    let html = `
      <div class="shift-block ${rowClass}"
           ondragover="allowDrop(event)"
           ondragleave="dragLeave(event)"
           ondrop="handleDrop(event, '${dateKey}', '${label}')">
        <div class="shift-label">${label}</div>
        <div class="slot-area">
    `;

    if(label === '휴무'){
      if(items.length === 0){
        if(isAdmin()) html += `<button class="empty-slot no-print" onclick="openAssignBySlot('${dateKey}', '휴무')">추가</button>`;
      }else{
        html += items.map(item => renderChip(item, dateKey, '휴무')).join('');
        if(isAdmin()) html += `<button class="empty-slot no-print" onclick="openAssignBySlot('${dateKey}', '휴무')">+ 추가</button>`;
      }
    }else{
      for(let i=0; i<items.length; i++){
        html += renderChip(items[i], dateKey, label);
      }
      const remain = Math.max(0, slotCount - items.length);

        for(let i=0; i<remain; i++){
          html += `<button class="empty-slot no-print" onclick="openAssignBySlot('${dateKey}', '${label}')">빈자리 ${i+1}</button>`;
        }
      }
    }

    html += `</div></div>`;
    return html;
  }

  function renderCalendar(){

      ? state.employees.find(e => Number(e.id) === Number(state.selectedEmployeeId))

    document.getElementById('printTitle').textContent = selectedEmp
      ? `${state.year}년 ${state.month}월 근무표 (${selectedEmp.name})`
      : `${state.year}년 ${state.month}월 근무표`;

    const weeks = getRenderWeeks(state.year, state.month);
    const realWeekCount = weeks.filter(week => isRealMonthInWeek(week, state.year, state.month)).length;
    const printRowHeight = '27.6mm';

    let html = `
      <table class="calendar ${realWeekCount === 5 ? 'five-week-month' : 'six-week-month'}" data-week-count="6" style="--print-row-height:${printRowHeight}">
        <thead>
          <tr>
            <th class="sun">일요일</th>
            <th>월요일</th>
            <th>화요일</th>
            <th>수요일</th>
            <th>목요일</th>
            <th>금요일</th>
            <th class="sat">토요일</th>
          </tr>
        </thead>
        <tbody>
    `;

    weeks.forEach((week, weekIndex) => {
      const isExtraWeek = weekIndex === 5 && !isRealMonthInWeek(week, state.year, state.month);
      html += `<tr class="${isExtraWeek ? 'extra-week' : ''}">`;
      for(const date of week){
        const y = date.getFullYear();
        const m = date.getMonth() + 1;
        const d = date.getDate();
        const dateKey = dKey(y,m,d);
        const isCurrentMonth = y === state.year && m === state.month;
        const dow = date.getDay();
        const numClass = dow === 0 ? 'sun' : (dow === 6 ? 'sat' : '');

        const holiday = state.holidays[dateKey];
        const subHoliday = state.subHolidays[dateKey];
        const earlyItems = getEmployeesByShift(dateKey, '조출');
        const dayItems = getEmployeesByShift(dateKey, '주간');
        const nightItems = getEmployeesByShift(dateKey, '야간');
        const offItems = getEmployeesByShift(dateKey, '휴무');
        const v = validateDay(dateKey);

        let cellClass = 'day-cell';
        if(!isCurrentMonth) cellClass += ' other-month';
        if(holiday) cellClass += ' holiday';
        if(subHoliday) cellClass += ' subholiday';
        if(state.selectedEmployeeId && isCurrentMonth){
          const selectedEntry = getEntry(Number(state.selectedEmployeeId), dateKey);
          if(selectedEntry.shift === '휴무'){
            cellClass += ' emp-off-highlight';
          }else{
            cellClass += ' emp-work-highlight';
          }
        }

        const isCopied = state.copiedDateKey === dateKey;

        html += `<td class="${cellClass}">`;
        html += `
          <div class="day-head">
            <div>
              <div class="day-num ${numClass}">${d}</div>
              <div class="mini-actions no-print ${isAdmin() ? '' : 'hidden'}">
                <button class="mini-btn ${isCopied ? 'copy-active' : ''}" onclick="copyDateConfig('${dateKey}')">복사</button>
                <button class="mini-btn" onclick="pasteDateConfig('${dateKey}')">붙여넣기</button>
              </div>
            </div>
            <div class="badge-wrap">
              ${holiday ? `<span class="holiday-badge">${holiday.name}</span>` : ''}
              ${subHoliday ? `<span class="subholiday-badge">${subHoliday.name}</span>` : ''}
            </div>
          </div>

        if(state.visibleRows?.조출 && (state.slotConfig.조출 || 0) > 0){
          html += renderShiftRow('조출', earlyItems, state.slotConfig.조출, dateKey);

        if(state.visibleRows?.야간 !== false){

        }

        html += `</td>`;

  function getWeekBuckets(y,m){
    const days = getDays(y,m);
    const buckets = [];
    let start = 1;
    while(start <= days){
      const end = Math.min(start + 6, days);
      buckets.push({ start, end });
      start += 7;
    }
    return buckets;
  }

  function formatWeeklyType(value){
    const int = Math.floor(value);
    const decimal = value - int;
    if(decimal === 0) return `주 ${int}일`;
    if(Math.abs(decimal - 0.5) < 0.01) return `주 ${int}.5일`;
    return `주 ${value.toFixed(1)}일`;
  }

  function calculateStats(){
    ensureScheduleForMonth(state.year, state.month);
    const weekBuckets = getWeekBuckets(state.year, state.month);

    return state.employees.map(emp=>{
      let dayShift = 0;
      let nightShift = 0;
      let offShift = 0;
      const weeklyCounts = [];

      for(let w=0; w<weekBuckets.length; w++){
        let count = 0;
        for(let d=weekBuckets[w].start; d<=weekBuckets[w].end; d++){
          const key = dKey(state.year, state.month, d);
          const entry = getEntry(emp.id, key);
          if(entry.shift === '조출' || entry.shift === '주간'){
            dayShift++;
            count++;
          }else if(entry.shift === '야간'){
            nightShift++;
            count++;
          }else{
            offShift++;
          }
        }
        weeklyCounts.push(count);
      }

      const totalWork = dayShift + nightShift;
      const avgWeekly = weekBuckets.length ? totalWork / weekBuckets.length : 0;

      return {
        name: emp.name,
        role: emp.role,
        dayShift,
        nightShift,
        offShift,
        totalWork,
        weeklyCounts,
        avgWeekly
      };
    });
  }

  function renderStats(){
    const rows = calculateStats();

    let html = `
      <div class="muted" style="margin-bottom:12px">
        기준: 주간 + 야간 = 근무일, 휴무 = 비근무일
      </div>
      <table class="basic">
        <thead>
          <tr>
            <th>이름</th>
            <th>기본 근무</th>
            <th>주간 근무일</th>
            <th>야간 근무일</th>
            <th>휴무일</th>
            <th>총 근무일</th>
            <th>주차별 근무일</th>
            <th>평균 주당 근무일</th>
            <th>판정</th>
          </tr>
        </thead>
        <tbody>
    `;

    rows.forEach(item=>{
      const weeklyText = item.weeklyCounts.map((v,i)=>`${i+1}주차 ${v}일`).join(' / ');
      let judge = formatWeeklyType(item.avgWeekly);
      if(item.avgWeekly >= 5.75) judge += ' · 과다';
      else if(item.avgWeekly >= 5.25) judge += ' · 주 5일 이상';
      else if(item.avgWeekly >= 4.75) judge += ' · 주 5일권';
      else if(item.avgWeekly >= 4.25) judge += ' · 주 4.5일권';
      else judge += ' · 주 4일권';

      html += `
        <tr>
          <td>${item.name}</td>
          <td>${item.role}</td>
          <td>${item.dayShift}</td>
          <td>${item.nightShift}</td>
          <td>${item.offShift}</td>
          <td><strong>${item.totalWork}</strong></td>
          <td>${weeklyText}</td>
          <td>${item.avgWeekly.toFixed(1)}일</td>
          <td>${judge}</td>
        </tr>
      `;
    });

    html += '</tbody></table>';
    document.getElementById('statsWrap').innerHTML = html;
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#39;')
      .replaceAll('\n','<br>');
  }

  function formatDateTime(ts){
    const d = new Date(ts);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    return `${y}-${m}-${day} ${hh}:${mm}`;
  }

  function saveMemo(){
    if(!requireAdmin()) return;
    const title = document.getElementById('memoTitle').value.trim();
    const content = document.getElementById('memoContent').value.trim();

    if(!title && !content){
      alert('메모 제목 또는 내용을 입력해줘.');
      return;
    }

    const now = Date.now();

    if(editingMemoId){
      const target = state.memos.find(m=>m.id === editingMemoId);
      if(target){
        target.title = title;
        target.content = content;
        target.updatedAt = now;
      }
    } else {
      state.memos.push({
        id: now,
        title,
        content,
        createdAt: now,
        updatedAt: now
      });
    }

    saveState();
    resetMemoForm();
    renderMemos();
  }

    const memo = state.memos.find(m=>m.id === id);

    document.getElementById('memoTitle').value = memo.title || '';

  function deleteMemo(id){
    if(!requireAdmin()) return;
    const memo = state.memos.find(m=>m.id === id);

    if(!confirm(`"${memo.title || '이 메모'}"를 삭제할까?`)) return;

    state.memos = state.memos.filter(m=>m.id !== id);
    if(editingMemoId === id){

    saveState();

  async function submitAdminLogin(){
    const value = document.getElementById('adminPasswordInput')?.value || '';
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
    const hash = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    if(hash !== ADMIN_PASSWORD_HASH){
      alert('비밀번호가 일치하지 않아.');
      return;
    }
    // 로그인 성공 — 현재 입력한 비밀번호 해시를 세션에 보관 (비밀번호 변경 시 사용)
    sessionStorage.setItem('adminCurrentHash', hash);
    state.isAdmin = true;
    saveState();
    closeModal();
    renderAll();
  }

        <div class="field" style="min-width:280px">
          <label>새 비밀번호 확인</label>
          <input id="pwConfirm" type="password" placeholder="새 비밀번호 다시 입력"
            onkeydown="if(event.key==='Enter') submitChangePassword()" />
        </div>
      </div>

      <div id="pwChangeMsg" style="font-size:13px;margin-top:8px;min-height:20px;"></div>

      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">취소</button>
        <button class="btn primary" onclick="submitChangePassword()">변경</button>
      </div>
    `);

  async function submitChangePassword(){
    const currentVal = document.getElementById('pwCurrent')?.value || '';
    const newVal     = document.getElementById('pwNew')?.value || '';
    const confirmVal = document.getElementById('pwConfirm')?.value || '';
    const msgEl      = document.getElementById('pwChangeMsg');

    if(!newVal){ msgEl.textContent = '새 비밀번호를 입력해줘.'; msgEl.style.color='#dc2626'; return; }
    if(newVal !== confirmVal){ msgEl.textContent = '새 비밀번호가 일치하지 않아.'; msgEl.style.color='#dc2626'; return; }
    if(newVal.length < 4){ msgEl.textContent = '비밀번호는 4자 이상이어야 해.'; msgEl.style.color='#dc2626'; return; }

    const toHash = async (str) => {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    };

    const currentHash = await toHash(currentVal);
    const newHash     = await toHash(newVal);

    msgEl.textContent = '변경 중…';
    msgEl.style.color = '#2563eb';

    try{
      const res = await fetch('/api/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentHash, newHash })
      });
      const data = await res.json();
      if(!res.ok){
        msgEl.textContent = data.error || '변경 실패';
        msgEl.style.color = '#dc2626';
        return;
      }
      // 성공 — 현재 세션의 해시도 업데이트
      ADMIN_PASSWORD_HASH = newHash;
      sessionStorage.setItem('adminCurrentHash', newHash);
      msgEl.textContent = '✓ 비밀번호가 변경됐어!';
      msgEl.style.color = '#16a34a';
      setTimeout(() => closeModal(), 1200);
    }catch(e){
      msgEl.textContent = '서버 오류. 다시 시도해줘.';
      msgEl.style.color = '#dc2626';
    }
  }

  function changeMonth(delta){
    state.month += delta;
    if(state.month > 12){
      state.month = 1;
      state.year++;
    }
    if(state.month < 1){
      state.month = 12;
      state.year--;
    }
    ensureScheduleForMonth(state.year, state.month);
    saveState();
    renderAll();
  }

    const name = document.getElementById('empName').value.trim();
    const role = document.getElementById('empRole').value;
    if(!name){

      return;
    }
    const id = state.employees.length ? Math.max(...state.employees.map(e=>e.id)) + 1 : 1;
    state.employees.push({ id, name, role });
    ensureScheduleForMonth(state.year, state.month);

    if(!confirm(`${emp.name} 직원을 삭제할까?`)) return;
    state.employees = state.employees.filter(e=>e.id !== empId);

  function resetCurrentMonth(){

    if(!confirm(`${state.year}년 ${state.month}월을 기본값으로 다시 생성할까?`)) return;
    const prefix = getMonthKeyPrefix(state.year, state.month);
    for(const empId in state.schedule){
      for(const key in state.schedule[empId]){
        if(key.startsWith(prefix)) delete state.schedule[empId][key];

    ensureScheduleForMonth(state.year, state.month);
    saveState('현재 월 초기화');

  function dragStart(e, empId, fromDate, fromShift){

    dragData = { empId, fromDate, fromShift };

  function allowDrop(e){
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
  }

  function dragLeave(e){
    e.currentTarget.classList.remove('drag-over');
  }

  function handleDrop(e, toDate, toShift){
    if(!requireAdmin()) return;
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if(!dragData) return;

    const { empId, fromDate, fromShift } = dragData;
    dragData = null;

    if(fromDate === toDate && fromShift === toShift) return;

    if(fromDate === toDate){
      state.schedule[empId][toDate].shift = toShift;
    } else {
      state.schedule[empId][fromDate].shift = '휴무';
      state.schedule[empId][toDate].shift = toShift;
    }

    saveState('드래그로 배정 변경');
    renderAll();
  }

  // ── 변경이력 로드 ─────────────────────────────────────────
  let changelogCache = [];
  async function loadChangelog(){
    const el = document.getElementById('changelogList');
    const badge = document.getElementById('changelogSyncStatus');
    if(!el) return;
    if(badge){ badge.textContent='불러오는 중…'; badge.className='sync-badge loading'; badge.style.display='inline-flex'; }
    try{
      const res = await fetch('/api/changelog');
      const logs = await res.json();
      changelogCache = logs;
      if(badge){ badge.style.display='none'; }
      if(!logs.length){
        el.innerHTML = '<div class="muted" style="font-size:13px;padding:8px 0;">아직 변경이력이 없어.</div>';
        return;
      }
      el.innerHTML = logs.map(log => `
        <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:800;margin-bottom:3px;">${escHtml(log.note)}</div>
            <div style="font-size:12px;color:var(--muted);">${escHtml(log.timestamp)} · ${log.year}년 ${log.month}월</div>
          </div>
        </div>
      `).join('');
    }catch(e){
      if(badge){ badge.textContent='오류'; badge.className='sync-badge error'; badge.style.display='inline-flex'; }
      el.innerHTML = '<div class="muted" style="font-size:13px;padding:8px 0;">불러오기 실패. 잠시 후 다시 시도해줘.</div>';
    }
  }

  function escHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── 스마트 폴링: changelog timestamp만 체크 → 변경 시에만 state 로드 ──
  let _knownLatestId = null;

  async function pollForChanges(){
    if(isAdmin()) return; // 관리자는 폴링 불필요
    try{
      const res = await fetch('/api/changelog');
      const logs = await res.json();
      if(!logs.length) return;
      const latestId = logs[0].id;
      if(_knownLatestId === null){
        _knownLatestId = latestId; // 최초 기준값 설정
        return;
      }
      if(latestId !== _knownLatestId){
        // 변경 감지 → state 전체 로드 후 화면 갱신
        _knownLatestId = latestId;
        await loadState();
        ensureHighlightColors();
        ensureEarlyShiftSetting();
        ensureVisibleRows();
        applyHighlightColors();
        ensureScheduleForMonth(state.year, state.month);
        renderAll();
        // changelog 탭이 열려있으면 함께 갱신
        if(state.activeTab === 'changelog') loadChangelog();
      }
    }catch(e){}
  }

  // ── 초기화 ──────────────────────────────────────────────────
  (async () => {
    await loadState();
    loadAdminSession();
    ensureHighlightColors();
    ensureEarlyShiftSetting();
    ensureVisibleRows();
    applyHighlightColors();
    ensureScheduleForMonth(state.year, state.month);
    markSaved(); // 초기 로드 시 미저장 없음
    renderAll();
    // 5초마다 변경이력 ID만 체크 (변경된 경우에만 state 전체 로드)
    setInterval(pollForChanges, 5000);
  })();

/* 메모장 드래그 기능 */
(function(){
  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;

  const panel = document.getElementById('memoPanel');
  const header = document.getElementById('memoHeader');

  if(!panel || !header) return;

  header.addEventListener('mousedown', function(e){
    isDragging = true;
    const rect = panel.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    panel.style.left = rect.left + 'px';
    panel.style.top = rect.top + 'px';
    panel.style.right = 'auto';
  });

  document.addEventListener('mousemove', function(e){
    if(!isDragging) return;
    panel.style.left = (e.clientX - offsetX) + 'px';
    panel.style.top = (e.clientY - offsetY) + 'px';
  });

  document.addEventListener('mouseup', function(){
    isDragging = false;
  });
})();
